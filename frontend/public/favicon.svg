<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="routeGrad" x1="8" y1="38" x2="38" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3d8f7a"/>
      <stop offset="60%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="28" y1="4" x2="44" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="48" height="48" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines (Tech Vibe) -->
  <path d="M 12 0 V 48 M 24 0 V 48 M 36 0 V 48 M 0 12 H 48 M 0 24 H 48 M 0 36 H 48" stroke="#334155" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.4"/>

  <!-- Route Path Curve -->
  <path d="M 10 36 C 16 36, 16 22, 26 22 C 34 22, 32 12, 36 12" fill="none" stroke="url(#routeGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Route Pulsing Dots / Waypoints -->
  <circle cx="10" cy="36" r="3.5" fill="#3d8f7a" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="26" cy="22" r="2.5" fill="#2dd4bf" stroke="#0f172a" stroke-width="1"/>

  <!-- Hero Sparkle Star (Destination) -->
  <g filter="url(#glow)">
    <path d="M 36 4 L 38.5 9.5 L 44 12 L 38.5 14.5 L 36 20 L 33.5 14.5 L 28 12 L 33.5 9.5 Z" fill="url(#starGrad)"/>
  </g>

  <!-- Secondary AI Sparkle Star -->
  <path d="M 15 11 L 16 13.5 L 18.5 14.5 L 16 15.5 L 15 18 L 14 15.5 L 11.5 14.5 L 14 13.5 Z" fill="#2dd4bf" opacity="0.9"/>
</svg>
