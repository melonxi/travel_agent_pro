name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-core:
    name: backend core (A0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --all-extras --frozen

      - name: Validate golden cases load
        run: |
          uv run python -c "from pathlib import Path; from evals.runner import load_golden_cases; n=len(load_golden_cases(str(Path('evals/golden_cases')))); assert n==40, n; print(f'golden_cases={n}')"

      - name: Core runtime tests
        env:
          OTEL_SDK_DISABLED: "true"
        run: |
          uv run pytest -q \
            tests/test_steering.py \
            tests/test_orchestrator.py \
            tests/test_phase3_candidate_store.py \
            tests/test_day_worker.py \
            tests/test_plan_writers.py \
            tests/test_phase_router.py \
            tests/test_eval_pipeline.py \
            tests/test_quality_gate.py \
            tests/test_trace_api.py \
            tests/test_session_persistence.py \
            --tb=line

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build
